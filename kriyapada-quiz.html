<!doctype html>
<html lang="sa">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>क्रियापदपरीक्षा</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f1e6;
        --bg-deep: #efe6d3;
        --card: #fffdf7;
        --ink: #26190e;
        --ink-soft: #5d4c36;
        --line: #ddd0b2;
        --accent: #9c3a10;
        --accent-ink: #ffffff;
        --gold: #b07d16;
        --gold-bg: #f3e5c3;
        --good: #2e6b27;
        --good-bg: #e2efdd;
        --bad: #a02c1c;
        --bad-bg: #f7e0da;
        --chip-bg: #fffdf7;
        --dev-font: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", serif;
        --ui-font: "Noto Serif Devanagari", "Tiro Devanagari Sanskrit", serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171008;
          --bg-deep: #100a05;
          --card: #241a10;
          --ink: #f1e7d3;
          --ink-soft: #c9b896;
          --line: #4a3a22;
          --accent: #e08a4e;
          --accent-ink: #221304;
          --gold: #dfa93e;
          --gold-bg: #3a2c12;
          --good: #9fce94;
          --good-bg: #1d2f1c;
          --bad: #f09a8a;
          --bad-bg: #3a1d16;
          --chip-bg: #241a10;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--ui-font);
        -webkit-font-smoothing: antialiased;
        padding-bottom: 92px;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 8px; }

      /* ---------- top bar ---------- */
      .topbar { padding: 6px 2px 12px; border-bottom: 1px solid var(--line); }
      .t-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .t-title { font-family: var(--dev-font); font-size: 24px; font-weight: 600; color: var(--accent); }
      .t-stats { font-size: 16px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
      .t-stats .dot { margin: 0 6px; opacity: .6; }
      .segs { display: flex; gap: 5px; margin-top: 10px; }
      .seg { flex: 1; height: 7px; border-radius: 4px; background: var(--bg-deep); border: 1px solid var(--line); }
      .seg.done-good { background: var(--good); border-color: var(--good); }
      .seg.done-bad { background: var(--bad); border-color: var(--bad); }
      .seg.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

      /* ---------- verse card ---------- */
      .verse-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 18px 14px;
        margin-top: 16px;
        box-shadow: 0 1px 3px rgba(38, 25, 14, .06);
      }
      .speaker { font-family: var(--dev-font); font-size: 17px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
      .verse { font-family: var(--dev-font); font-size: 21px; line-height: 1.95; }
      .verse .vline { display: block; }
      .vref { margin-top: 10px; font-size: 14px; color: var(--ink-soft); }

      .question { font-family: var(--dev-font); font-size: 19px; font-weight: 600; margin: 20px 2px 12px; }

      /* ---------- chips ---------- */
      .chips { display: flex; flex-wrap: wrap; gap: 9px; }
      .chip {
        min-height: 44px;
        padding: 8px 15px;
        font-family: var(--dev-font);
        font-size: 18px;
        color: var(--ink);
        background: var(--chip-bg);
        border: 1.5px solid var(--line);
        border-radius: 999px;
        transition: background .12s ease, border-color .12s ease, color .12s ease;
      }
      .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .chip:disabled { cursor: default; opacity: 1; }
      .chip.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
      .chip.missed { background: var(--gold-bg); border: 2px dashed var(--gold); color: var(--ink); font-weight: 700; }
      .chip.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 700; }
      .chip.dim { opacity: .45; }

      /* ---------- legend ---------- */
      .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 15px; color: var(--ink-soft); }
      .legend .li { display: inline-flex; align-items: center; gap: 7px; }
      .sw { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
      .sw.good { background: var(--good-bg); border: 1.5px solid var(--good); }
      .sw.gold { background: var(--gold-bg); border: 2px dashed var(--gold); }
      .sw.bad { background: var(--bad-bg); border: 1.5px solid var(--bad); }

      /* ---------- explanation ---------- */
      .explain { margin-top: 22px; }
      .explain h2 { font-family: var(--dev-font); font-size: 19px; color: var(--accent); margin: 0 0 10px; }
      .vrow {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid var(--gold);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .vrow-word { font-family: var(--dev-font); font-size: 21px; font-weight: 700; margin-bottom: 6px; }
      .vrow dl { margin: 0; }
      .vrow .fld { display: flex; gap: 10px; padding: 3px 0; font-size: 16px; line-height: 1.55; }
      .vrow dt { flex: 0 0 86px; color: var(--ink-soft); font-weight: 600; }
      .vrow dd { margin: 0; font-family: var(--dev-font); word-break: break-word; }

      /* ---------- completion ---------- */
      .done-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 18px;
        margin-top: 16px;
        text-align: center;
      }
      .done-title { font-family: var(--dev-font); font-size: 24px; font-weight: 600; color: var(--accent); }
      .done-score { font-family: var(--dev-font); font-size: 44px; font-weight: 700; margin: 14px 0 4px; }
      .done-score-label { font-size: 16px; color: var(--ink-soft); }
      .marks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 6px; }
      .mark {
        width: 44px; height: 44px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-family: var(--dev-font); font-size: 19px; font-weight: 700;
        border: 2px solid var(--line); background: var(--bg);
      }
      .mark.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
      .mark.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
      .retry-btn {
        margin-top: 18px; min-height: 48px; padding: 10px 26px;
        font-size: 18px; font-weight: 700; font-family: var(--dev-font);
        background: var(--accent); color: var(--accent-ink);
        border: none; border-radius: 999px;
      }

      /* ---------- action bar ---------- */
      .actionbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        background: var(--bg-deep);
        border-top: 1px solid var(--line);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      }
      .ab-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
      .ab-msg { flex: 1; font-size: 16px; font-weight: 600; color: var(--ink-soft); line-height: 1.4; }
      .ab-msg.good { color: var(--good); }
      .ab-btn {
        min-height: 48px; padding: 10px 24px; flex: 0 0 auto;
        font-size: 18px; font-weight: 700; font-family: var(--dev-font);
        background: var(--accent); color: var(--accent-ink);
        border: none; border-radius: 999px;
      }
      .ab-btn.secondary { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="t-row">
          <div class="t-title">क्रियापदपरीक्षा</div>
          <div class="t-stats"><span id="progLabel"></span><span class="dot">·</span><span id="scoreLabel"></span></div>
        </div>
        <div class="segs" id="segs"></div>
      </header>

      <main id="quizView">
        <section class="verse-card">
          <div class="speaker" id="speaker"></div>
          <div class="verse" id="verseText"></div>
          <div class="vref" id="vref"></div>
        </section>

        <p class="question">अस्मिन् श्लोके सर्वाणि क्रियापदानि चिनुत ।</p>

        <div class="chips" id="chips"></div>

        <div class="legend" id="legend" hidden>
          <span class="li"><span class="sw good"></span>सम्यक् चितम्</span>
          <span class="li"><span class="sw gold"></span>अचितं क्रियापदम्</span>
          <span class="li"><span class="sw bad"></span>न क्रियापदम्</span>
        </div>

        <section class="explain" id="explain" hidden>
          <h2>क्रियापदानां विवरणम्</h2>
          <div id="verbRows"></div>
        </section>
      </main>

      <main id="doneView" hidden>
        <section class="done-card">
          <div class="done-title">परीक्षा समाप्ता</div>
          <div class="done-score" id="doneScore"></div>
          <div class="done-score-label">अङ्काः</div>
          <div class="marks" id="marks"></div>
          <button class="retry-btn" id="retryBtn">पुनरारम्भः</button>
        </section>
      </main>
    </div>

    <footer class="actionbar" id="actionbar">
      <div class="ab-inner">
        <span class="ab-msg" id="abMsg"></span>
        <button class="ab-btn" id="submitBtn">निवेदय</button>
        <button class="ab-btn" id="nextBtn" hidden></button>
      </div>
    </footer>

      var DEV_DIGITS = ["०","१","२","३","४","५","६","७","८","९"];
      function devNum(n) { return String(n).split("").map(function (c) { return DEV_DIGITS[+c]; }).join(""); }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      var state = { idx: 0, score: 0, results: [], selected: {}, graded: false };

      var els = {
        prog: document.getElementById("progLabel"),
        score: document.getElementById("scoreLabel"),
        segs: document.getElementById("segs"),
        quiz: document.getElementById("quizView"),
        done: document.getElementById("doneView"),
        speaker: document.getElementById("speaker"),
        verse: document.getElementById("verseText"),
        vref: document.getElementById("vref"),
        chips: document.getElementById("chips"),
        legend: document.getElementById("legend"),
        explain: document.getElementById("explain"),
        verbRows: document.getElementById("verbRows"),
        msg: document.getElementById("abMsg"),
        submit: document.getElementById("submitBtn"),
        next: document.getElementById("nextBtn"),
        actionbar: document.getElementById("actionbar"),
        doneScore: document.getElementById("doneScore"),
        marks: document.getElementById("marks"),
        retry: document.getElementById("retryBtn")
      };

      function verbIndexSet(v) {
        var s = {};
        v.verbs.forEach(function (vb) { s[vb.i] = true; });
        return s;
      }

      function renderHeader() {
        els.prog.textContent = "श्लोकः " + devNum(state.idx + 1) + " / " + devNum(VERSES.length);
        els.score.textContent = "अङ्काः " + devNum(state.score) + " / " + devNum(VERSES.length);
        els.segs.innerHTML = VERSES.map(function (v, i) {
          var cls = "seg";
          if (state.results[i] === true) cls += " done-good";
          else if (state.results[i] === false) cls += " done-bad";
          else if (i === state.idx) cls += " current";
          return '<span class="' + cls + '"></span>';
        }).join("");
      }

      function renderVerse() {
        var v = VERSES[state.idx];
        state.selected = {};
        state.graded = false;
        els.speaker.textContent = v.speaker;
        els.verse.innerHTML = v.lines.map(function (ln) {
          return '<span class="vline">' + esc(ln) + "</span>";
        }).join("");
        els.vref.textContent = "अध्यायः १ · श्लोकः " + devNum(v.n);
        els.chips.innerHTML = "";
        v.words.forEach(function (w, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = w;
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", function () { toggleChip(i, b); });
          els.chips.appendChild(b);
        });
        els.legend.hidden = true;
        els.explain.hidden = true;
        els.verbRows.innerHTML = "";
        els.msg.textContent = "चितानि पदानि — ०";
        els.msg.className = "ab-msg";
        els.submit.hidden = false;
        els.next.hidden = true;
        renderHeader();
        window.scrollTo(0, 0);
      }

      function toggleChip(i, btn) {
        if (state.graded) return;
        if (state.selected[i]) {
          delete state.selected[i];
          btn.setAttribute("aria-pressed", "false");
        } else {
          state.selected[i] = true;
          btn.setAttribute("aria-pressed", "true");
        }
        els.msg.textContent = "चितानि पदानि — " + devNum(Object.keys(state.selected).length);
      }

      function grade() {
        if (state.graded) return;
        state.graded = true;
        var v = VERSES[state.idx];
        var vset = verbIndexSet(v);
        var perfect = true;
        var chipEls = els.chips.children;
        v.words.forEach(function (w, i) {
          var b = chipEls[i];
          b.disabled = true;
          var isVerb = !!vset[i], isSel = !!state.selected[i];
          if (isVerb && isSel) b.classList.add("correct");
          else if (isVerb && !isSel) { b.classList.add("missed"); perfect = false; }
          else if (!isVerb && isSel) { b.classList.add("wrong"); perfect = false; }
          else b.classList.add("dim");
        });
        if (perfect) state.score += 1;
        state.results[state.idx] = perfect;

        els.legend.hidden = false;
        els.verbRows.innerHTML = v.verbs.map(function (vb) {
          return '<div class="vrow"><div class="vrow-word">' + esc(vb.word) + "</div><dl>" +
            '<div class="fld"><dt>विश्लेषणम्</dt><dd>' + esc(vb.morph) + "</dd></div>" +
            '<div class="fld"><dt>सम्बन्धः</dt><dd>' + esc(vb.rel) + "</dd></div>" +
            '<div class="fld"><dt>अर्थः</dt><dd>' + esc(vb.hindi) + "</dd></div>" +
            "</dl></div>";
        }).join("");
        els.explain.hidden = false;

        els.msg.textContent = perfect ? "साधु ! सर्वं सम्यक् ।" : "सम्यक् उत्तरं अधः अस्ति ।";
        els.msg.className = "ab-msg" + (perfect ? " good" : "");
        els.submit.hidden = true;
        els.next.textContent = state.idx === VERSES.length - 1 ? "परिणामं पश्यतु" : "अग्रिमः श्लोकः";
        els.next.hidden = false;
        renderHeader();
      }

      function showDone() {
        els.quiz.hidden = true;
        els.actionbar.hidden = true;
        els.done.hidden = false;
        els.doneScore.textContent = devNum(state.score) + " / " + devNum(VERSES.length);
        els.marks.innerHTML = VERSES.map(function (v, i) {
          return '<span class="mark ' + (state.results[i] ? "good" : "bad") + '">' + devNum(v.n) + "</span>";
        }).join("");
        els.prog.textContent = "श्लोकः " + devNum(VERSES.length) + " / " + devNum(VERSES.length);
        window.scrollTo(0, 0);
      }

      els.submit.addEventListener("click", grade);
      els.next.addEventListener("click", function () {
        if (state.idx === VERSES.length - 1) { showDone(); return; }
        state.idx += 1;
        renderVerse();
      });
      els.retry.addEventListener("click", function () {
        state = { idx: 0, score: 0, results: [], selected: {}, graded: false };
        els.done.hidden = true;
        els.quiz.hidden = false;
        els.actionbar.hidden = false;
        renderVerse();
      });

      renderVerse();
    </script>
